[package]
name = "line-pulse-wasm"
version = "1.0.0"
edition = "2024"
authors = ["Poseidon <18646154381@163.com>"]
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
